# Publishes a release APK to Firebase App Distribution (project linkzora-app).
# Runs on every push to master and on demand. Needs the repository secret
# FIREBASE_SERVICE_ACCOUNT: the JSON key of a service account with the
# "Firebase App Distribution Admin" role, plus the release key: ANDROID_KEYSTORE_BASE64
# (the .jks in base64), ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (see docs/linkzora.md,
# "Distribuição"). The same key must sign every build, or testers cannot update.
name: Firebase App Distribution
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown to testers
        required: false
concurrency:
  group: distribute
  cancel-in-progress: true
env:
  FIREBASE_APP_ID: '1:551246781244:android:9c1186ae26bb9af4ab1c39'
  TESTER_GROUPS: testers
jobs:
  distribute:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/linkzora-release.jks
          {
            echo "storeFile=linkzora-release.jks"
            echo "storePassword=$PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$PASSWORD"
          } > android/key.properties
      - name: Build release APK
        # The build number grows with every commit so testers always get an update.
        run: flutter build apk --release --build-number=$(git rev-list --count HEAD)
      - name: Release notes
        run: |
          if [ -n "${{ github.event.inputs.notes }}" ]; then
            echo "${{ github.event.inputs.notes }}" > notes.txt
          else
            git log -1 --pretty=format:'%h %s' > notes.txt
          fi
      - name: Upload to App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15.14.0 appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes-file notes.txt
