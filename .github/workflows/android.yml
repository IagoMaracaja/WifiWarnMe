name: Android APK
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform scaffolding
        run: |
          flutter create --platforms=android --org com.wifiwarnme .
          sed -i 's/com.wifiwarnme.wifiwarnme/com.wifiwarnme.app/g' android/app/build.gradle.kts
          flutter pub get
      - name: Analyze Dart
        run: flutter analyze lib
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WifiWarnMe-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
